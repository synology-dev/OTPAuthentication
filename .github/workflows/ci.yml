name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Dependency advisory scan
        if: matrix.python-version == '3.11'
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements-dev.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Shell syntax
        run: |
          sh -n package/bin/run-python
          for f in spk/scripts/*; do sh -n "$f"; done
      - name: Python compile
        run: python -m compileall -q package/backend

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64, armv7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build SPK
        env:
          TARGET: ${{ matrix.target }}
          VERSION: 1.0.0-001
        run: |
          chmod +x build.sh package/bin/run-python package/ui/webapi/*.cgi spk/scripts/*
          ./build.sh
      - name: Wheel ABI sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("package/deps") / "${{ matrix.target }}"
          bad = []
          for whl in root.rglob("*.whl"):
              name = whl.name.lower()
              if "linux_" in name and "manylinux" not in name and "musllinux" not in name:
                  bad.append(whl.name)
              if "cp314" in name or "cp313" in name:
                  bad.append(whl.name)
          if bad:
              raise SystemExit("host/native wheels found: " + ", ".join(bad))
          print("wheel ABI ok")
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: OTPManager-${{ matrix.target }}
          path: |
            dist/*.spk
            dist/*.sha256
            package/deps/manifest.json
