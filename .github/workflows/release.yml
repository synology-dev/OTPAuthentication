name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64, armv7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0-001" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          chmod +x build.sh package/bin/run-python package/ui/webapi/*.cgi spk/scripts/*
          pytest -q
          VERSION="${{ steps.ver.outputs.version }}" TARGET=${{ matrix.target }} ./build.sh
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.spk
            dist/*.sha256

  draft_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.spk' -o -name '*.sha256' \) -exec cp {} dist/ \;
          (cd dist && sha256sum *.spk | tee SHA256SUMS)
          ls -la dist
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          draft: true
          files: |
            dist/*.spk
            dist/*.sha256
            dist/SHA256SUMS
          generate_release_notes: true
